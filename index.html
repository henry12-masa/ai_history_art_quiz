enter}.ad-area{width:100%;min-width:auto;position:static}.choices{grid-template-columns:1fr}.frame{height:190px}}

    <h1>AI生成っぽい歴史画像クイズ</h1>

    <div id="result" class="result"></div>
    <button id="restart" class="restart" onclick="restartGame()">もう一度遊ぶ</button>

const realData = realPaintings.map(p => ({title:p[0], q:`次の設定は実在する歴史的な絵画・作品？ それともAIが作ったような架空画像？`, hint:p[1], answer:"本物の絵画", explain:`「${p[0]}」は実在する作品・実在する美術題材です。説明の中に、作者・時代・画風など現実の美術史とつながる要素があります。`}));
const fakeData = fakeThemes.map(t => ({title:t, q:`次の設定は実在する歴史的な絵画・作品？ それともAIが作ったような架空画像？`, hint:"歴史上の人物・時代らしさはあるが、スマホ・AI・ドローン・VRなど時代に合わない要素が混ざっている。", answer:"AI風の架空画像", explain:`「${t}」はこのクイズ用の架空タイトルです。歴史モチーフに現代アイテムが混ざっており、AI生成画像っぽい違和感があります。`}));
const quizData = [...realData, ...fakeData];
let questions=[], current=0, score=0, lock=false;
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function startGame(){questions=shuffle([...quizData]).slice(0,50);current=0;score=0;lock=false;document.getElementById("restart").style.display="none";showQuestion();}
function showQuestion(){lock=false;const q=questions[current];document.getElementById("count").textContent=`${current+1} / 50`;document.getElementById("score").textContent=`正解 ${score}`;document.getElementById("frameTitle").textContent=q.title;document.getElementById("question").textContent=q.q;document.getElementById("hint").textContent=q.hint;document.getElementById("result").innerHTML="";const choicesEl=document.getElementById("choices");choicesEl.innerHTML="";shuffle(["本物の絵画","AI風の架空画像"]).forEach(choice=>{const btn=document.createElement("button");btn.textContent=choice;btn.onclick=()=>checkAnswer(btn,choice);choicesEl.appendChild(btn);});}
function checkAnswer(button,choice){if(lock)return;lock=true;const q=questions[current];const buttons=document.querySelectorAll("#choices button");buttons.forEach(btn=>{btn.disabled=true;if(btn.textContent===q.answer){btn.classList.add("correct");}});if(choice===q.answer){score++;button.classList.add("correct");document.getElementById("result").innerHTML=`正解！<div class="explain">${q.explain}</div>`;}else{button.classList.add("wrong");document.getElementById("result").innerHTML=`不正解… 正解は「${q.answer}」<div class="explain">${q.explain}</div>`;}document.getElementById("score").textContent=`正解 ${score}`;setTimeout(()=>{current++;if(current<questions.length){showQuestion();}else{finishGame();}},1700);}
function finishGame(){document.getElementById("frameTitle").textContent="鑑定終了！";document.getElementById("question").textContent=`50問終了！ ${score}問正解！`;document.getElementById("hint").textContent="本物の美術史っぽさと、AI画像っぽい時代ズレをどれだけ見抜けた？";document.getElementById("choices").innerHTML="";let message="";if(score>=45){message="美術鑑定マスター！AIっぽい違和感をかなり見抜けています！";}else if(score>=30){message="かなり良い成績！有名絵画と架空タイトルの区別ができています！";}else{message="もう一度挑戦して、本物っぽさと時代ズレの感覚をつかもう！";}document.getElementById("result").innerHTML=message;document.getElementById("restart").style.display="block";}
function restartGame(){startGame();}startGame();
</script>
